site_name: PortMaster Wiki
site_url: https://portmaster.games
repo_url: https://github.com/PortsMaster/PortMaster-New
repo_name: GitHub
theme:
  name: material
  logo: assets/images/logo.png
  font:
      text: Roboto
      code: Roboto Mono
  icon:
      repo: fontawesome/brands/github
  palette:
    - scheme: light
      primary: 
      accent: 
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: dark
      primary: 
      accent:   
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.path
    - navigation.footer
    - toc.follow
    - toc.integrate 
    - search.suggest
    - content.tooltips
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - header.social
markdown_extensions:
  - tables
  - attr_list
  # Required by the "Term / :   definition" blocks in installing-portmaster.md
  # and installing-ports.md - without it they render as a stray colon.
  - def_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      toc_depth: 2
      permalink: ¶
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
extra_css:
  - assets/stylesheets/extra.css
  # Split out of one 3200-line games.css - order preserves the original
  # file's cascade (shared/base pieces before games.md-specific ones).
  - assets/stylesheets/games-filters.css
  - assets/stylesheets/shared-cards.css
  - assets/stylesheets/shared-modal.css
  - assets/stylesheets/port-page.css
  - assets/stylesheets/shared-toggle-pagination.css
  - assets/stylesheets/games-discover-browse.css
  - assets/stylesheets/porters.css
  - assets/stylesheets/homepage.css
  - assets/stylesheets/handhelds.css
  - assets/stylesheets/porter-tools.css
plugins:
   - glightbox
   - search
   - macros
   - blog:
      blog_dir: news
      blog_toc: true
      post_date_format: full
      archive: true
      archive_toc: true
      post_excerpt: required
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PortsMaster
    - icon: fontawesome/brands/discord
      link: https://discord.gg/eqjK6yNQS4
    - icon: fontawesome/solid/envelope
      link: mailto:contact@portmaster.games
    - icon: fontawesome/brands/twitter
      link: https://x.com/PortMasterLinux
    - icon: fontawesome/solid/hand-holding-dollar
      link: https://opencollective.com/portmaster
  favicon: assets/images/logo.ico  
extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js
nav:
  - Home: index.md
  - Games: games.md
  # Split by audience rather than by document type: everything a player
  # needs is under Help, everything a porter needs is under Contribute.
  # Section names here are independent of file paths, so this ordering
  # carries no URL changes - pages stay where they are on disk.
  - Contribute:
      - How to Contribute: contribute/index.md
      # Port Suggestions is deliberately absent from nav: the page is still
      # built and reachable at /contribute/suggestions/, but only by URL.
      # Its front matter also excludes it from search.
      # Ordered to follow the actual porting workflow: decide if it can be
      # ported, set up a build, write the script, package it.
      - Porting Games:
          - What Can Be Ported?: contribute/porting/what-can-be-ported.md
          - Build Environments: contribute/porting/build-environments.md
          - Script Templates: contribute/porting/script-templates.md
          - Packaging: contribute/porting/packaging.md
          - Developer Details: contribute/porting/developer-details.md
          - Engines:
              - Godot: contribute/porting/engines/godot.md
              - GameMaker Studio: contribute/porting/engines/gamemaker-studio.md
              - Love2D: contribute/porting/engines/love2d.md
      - GUI Development:
          - Themes: contribute/gui/theme-engine.md
          - Translation: contribute/gui/translation.md
      - Porter Tools:
          - JSON Generator: tools/json-generator.md
          - README Generator: tools/markdown-generator.md
          - Gameinfo Generator: tools/gameinfo-generator.md
          - Cover Generator: tools/cover-generator.md
  - Community:
      - Overview: community/index.md
      - Porters: porters.md
      - News: news/index.md
  # Last so it sits at the far right of the tab bar - nav order is what
  # drives tab order, so this is the only thing that controls it.
  - Help:
      - Getting Started: installation/installing-portmaster.md
      - Installing Ports: installation/installing-ports.md
      - Supported Handhelds: installation/supported-handhelds.md
      - Runtimes: installation/runtimes.md
      - FAQ: faq.md